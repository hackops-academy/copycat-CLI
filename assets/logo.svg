<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Cyber Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter for the Clone Outline -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Application Background -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#bg-grad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="102" ry="102" fill="none" stroke="#1e293b" stroke-width="4" />

  <g transform="translate(0, -15)">
    <!-- BACK WINDOW (The Original Webpage) -->
    <!-- Window Body -->
    <rect x="220" y="100" width="160" height="190" rx="12" fill="none" stroke="#334155" stroke-width="6" />
    <!-- Window Top Bar -->
    <line x1="220" y1="130" x2="380" y2="130" stroke="#334155" stroke-width="6" />
    <!-- Window Control Dots -->
    <circle cx="236" cy="115" r="4" fill="#334155" />
    <circle cx="250" cy="115" r="4" fill="#334155" />
    
    <!-- Wireframe content in original -->
    <line x1="240" y1="160" x2="360" y2="160" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="240" y1="180" x2="320" y2="180" stroke="#334155" stroke-width="4" stroke-linecap="round" />
    <line x1="240" y1="200" x2="340" y2="200" stroke="#334155" stroke-width="4" stroke-linecap="round" />

    <!-- FRONT WINDOW (The Clone / The Copycat) -->
    <!-- Window Body -->
    <rect x="132" y="150" width="200" height="230" rx="12" fill="#020617" stroke="url(#neon-grad)" stroke-width="6" filter="url(#neon-glow)" />
    <!-- Window Top Bar -->
    <line x1="132" y1="186" x2="332" y2="186" stroke="url(#neon-grad)" stroke-width="6" filter="url(#neon-glow)" />
    <!-- Window Control Dots -->
    <circle cx="150" cy="168" r="5" fill="#10b981" />
    <circle cx="168" cy="168" r="5" fill="#10b981" />
    <circle cx="186" cy="168" r="5" fill="#10b981" />

    <!-- Digital Cat Face (Inside the cloned window) -->
    <g transform="translate(0, 10)">
      <!-- Cat Head Outline -->
      <path d="M 190 295 L 190 235 L 216 255 L 248 255 L 274 235 L 274 295 L 232 320 Z" 
            fill="none" 
            stroke="#10b981" 
            stroke-width="6" 
            stroke-linejoin="round" 
            filter="url(#neon-glow)" />
      
      <!-- Left Eye -->
      <path d="M 205 275 L 217 268 L 217 282 Z" fill="#10b981" filter="url(#neon-glow)" />
      <!-- Right Eye -->
      <path d="M 259 275 L 247 268 L 247 282 Z" fill="#10b981" filter="url(#neon-glow)" />
      
      <!-- Whiskers -->
      <line x1="175" y1="280" x2="190" y2="285" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <line x1="175" y1="295" x2="190" y2="290" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <line x1="289" y1="280" x2="274" y2="285" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
      <line x1="289" y1="295" x2="274" y2="290" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <!-- Main App Name -->
    <text x="256" y="435" font-family="monospace, sans-serif" font-size="46" font-weight="900" letter-spacing="4" fill="#ffffff">
      COPY<tspan fill="#10b981">CAT</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="256" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#64748b">
      WEB CLONING TOOL
    </text>
  </g>
</svg>
